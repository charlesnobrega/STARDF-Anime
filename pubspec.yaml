name: stardf_anime_mobile
description: StarDF-Anime mobile application for Android with Flutter and GoMobile integration.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Database
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.8.0

  # HTTP & Networking
  http: ^1.1.0
  connectivity_plus: ^5.0.0

  # UI & Design
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  go_router: ^12.0.0

  # Logging
  logger: ^2.0.0

  # JSON Serialization
  json_serializable: ^6.7.0
  json_annotation: ^4.8.0

  # Error Handling
  dartz: ^0.10.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Testing
  mockito: ^5.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.13.0
  json_serializable: ^6.7.0

  # Integration Testing
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/brand/
